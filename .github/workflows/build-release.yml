name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev wget
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Cython==0.29.33 buildozer
    
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = SafeTalk Voice Analyzer
        package.name = safetalk
        package.domain = com.safetalk
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,otf,wav,mp3,m4a
        requirements = python3==3.9.10,kivy==2.2.1,kivymd==1.1.1,requests==2.31.0,plyer==2.1,pyjnius==1.5.0,android==1.0.0
        icon.filename = assets/safetalk_icon.png
        orientation = portrait
        fullscreen = 0
        android.permissions = RECORD_AUDIO,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,INTERNET
        android.api = 33
        android.minapi = 21
        android.sdk = 33
        android.ndk = 25b
        android.enable_androidx = true
        android.accept_sdk_license = True
        android.accept_ndk_license = True
        android.arch = arm64-v8a
        android.package_mode = release
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        build_dir = ./.buildozer
        p4a.source_dir = ~/.buildozer/android/platform/python-for-android
        ant.source_dir = ~/.buildozer/android/platform/apache-ant
        android.sdk_path = ~/.buildozer/android/platform/android-sdk
        android.ndk_path = ~/.buildozer/android/platform/android-ndk-r25b
        android.accept_sdk_license = True
        android.accept_ndk_license = True
        
        [android_abi]
        armeabi-v7a = False
        arm64-v8a = True
        x86 = False
        x86_64 = False
        EOF
    
    - name: Build Release APK
      run: |
        yes | buildozer -v android release || true
        if [ ! -f bin/*.apk ]; then
          yes | buildozer android clean
          yes | buildozer -v android release
        fi
      env:
        CI: true
        CONTINUOUS_INTEGRATION: true
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: SafeTalk-Release-v${{ github.event.inputs.version }}
        path: bin/*.apk
        if-no-files-found: error
