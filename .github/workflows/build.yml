# .github/workflows/build-apk.yml
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          python3-dev \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-0 \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          unzip \
          openjdk-17-jdk \
          wget \
          autoconf \
          libtool \
          cmake

    - name: Setup Java
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

    - name: Install Cython and Buildozer
      run: |
        pip install --upgrade pip
        pip install cython==0.29.37
        pip install buildozer==1.5.0

    - name: Create icon
      run: |
        mkdir -p assets
        pip install Pillow
        python3 << 'PYTHON_SCRIPT'
        from PIL import Image, ImageDraw
        img = Image.new('RGBA', (512, 512), (33, 150, 243, 255))
        draw = ImageDraw.Draw(img)
        draw.ellipse([56, 56, 456, 456], (255, 255, 255, 255))
        draw.text((256, 256), 'ST', (33, 150, 243, 255), anchor='mm', font_size=180)
        img.save('assets/safetalk_icon.png')
        PYTHON_SCRIPT

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF' 
        [app]
        title = SafeTalk
        package.name = safetalk
        package.domain = com.safetalk
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf
        version = 1.0.0
        requirements = python3==3.9.19,kivy==2.1.0,kivymd==1.1.1,requests==2.28.0,plyer==2.1,pyjnius==1.4.0
        android.permissions = INTERNET,RECORD_AUDIO,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE
        android.api = 30
        android.minapi = 21
        android.ndk = 23b
        android.sdk = 30
        android.archs = armeabi-v7a
        android.icon.filename = %(source.dir)s/assets/safetalk_icon.png
        fullscreen = 0
        orientation = portrait
        
        [buildozer]
        log_level = 2
        EOF
        
            - name: Build APK
              run: |
                # Автоматически принимаем лицензии
                yes | buildozer android debug || true
                
                # Очищаем и строим заново
                rm -rf .buildozer
                yes | buildozer android debug
              timeout-minutes: 60
        
            - name: Upload APK
              uses: actions/upload-artifact@v4
              with:
                name: SafeTalk-App
                path: bin/*.apk
