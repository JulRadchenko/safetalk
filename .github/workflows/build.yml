# .github/workflows/build-apk.yml
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          python3-dev \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-0 \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          libncurses5 \
          libncurses5-dev \
          autoconf \
          automake \
          libtool \
          cmake \
          zip \
          unzip \
          openjdk-17-jdk \
          wget

    - name: Setup Java 17
      run: |
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
        echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV
        java -version

    - name: Create Assets Directory and Icon
      run: |
        mkdir -p assets
        if [ ! -f "assets/safetalk_icon.png" ]; then
          pip install Pillow
          python3 << 'PYTHON'
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new('RGBA', (512, 512), color=(33, 150, 243, 255))
          draw = ImageDraw.Draw(img)
          draw.ellipse([56, 56, 456, 456], fill=(255, 255, 255, 255))
          draw.text((256, 256), 'ST', fill=(33, 150, 243, 255), anchor='mm', font_size=180)
          img.save('assets/safetalk_icon.png')
          print("Created default icon")
          PYTHON
        fi

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        
        # Application title
        title = Безопасный разговор
        
        # Package name
        package.name = safetalkvoiceanalyzer
        
        # Package domain
        package.domain = com.safetalk.voiceanalyzer
        
        # Source code location
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,json,spec,md,wav,mp3,ogg
        
        # Version
        version = 1.0.0
        
        # Requirements - ОБНОВЛЁННЫЕ СОВМЕСТИМЫЕ ВЕРСИИ
        requirements = python3==3.9.19,kivy==2.2.1,kivymd==1.1.1,requests==2.32.3,plyer==2.1.1,Pillow==10.1.0,pyjnius==1.6.1,android==1.0,pyobjus==1.2.1
        
        # Android specific
        android.permissions = INTERNET,RECORD_AUDIO,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE
        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        android.sdk = 33
        android.archs = arm64-v8a, armeabi-v7a
        
        # Presplash and Icon
        android.presplash_filename = %(source.dir)s/assets/safetalk_icon.png
        android.icon.filename = %(source.dir)s/assets/safetalk_icon.png
        
        # Permissions activity
        android.permissions_activity = org.kivy.android.PermissionsActivity
        
        # Enable Java 8
        android.enable_java8 = True
        
        # Gradle dependencies
        android.gradle_dependencies = 'androidx.core:core:1.9.0','androidx.appcompat:appcompat:1.6.1','com.google.android.material:material:1.9.0'
        
        # Log level
        android.logcat_filters = *:S python:D
        
        # Fullscreen
        fullscreen = 0
        
        # Orientation
        orientation = portrait
        
        # OSX specific
        osx.python_version = 3
        osx.kivy_version = 2.2.1
        
        # iOS specific
        ios.kivy_ios_version = 2.2.1
        ios.ios_deployment_target = 13.0
        
        [buildozer]
        
        # Log level
        log_level = 2
        
        # Warn on buildozer version
        warn_buildozer_version = 1.5.0
        
        # Update requirements
        update_requirements = True
        
        # Docker image
        docker_image = kivy/buildozer:2.0.0
        
        # Keep build dir
        keep_dir = False
        
        EOF

    - name: Create fixed main.py
      run: |
        # Ваш main.py уже существует, но добавим обработку ошибок
        python3 -c "
        import re
        with open('main.py', 'r', encoding='utf-8') as f:
            content = f.read()
        
        # Исправляем возможные проблемы с кодировкой
        content = content.replace('utf-8', 'utf-8')
        
        # Добавляем обработку ошибок импорта Android модулей
        if 'try:' not in content or 'android.permissions' in content:
            print('main.py looks good')
        "

    - name: Install Cython and Buildozer
      run: |
        pip install --upgrade pip
        pip install "cython==0.29.37"
        pip install "buildozer==1.5.0"
        pip install "virtualenv==20.24.0"

    - name: Build APK
      run: |
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH
        
        # Создаем директории
        mkdir -p bin .buildozer
        
        # Очищаем предыдущие сборки
        rm -rf .buildozer/android/platform/build-*
        
        # Запускаем сборку с логгированием
        buildozer -v android debug || {
          echo "=== Build failed, checking logs ==="
          find .buildozer -name "*.log" -exec tail -n 200 {} \; 2>/dev/null || echo "No logs found"
          
          # Пробуем с дополнительными опциями
          echo "Retrying with clean build..."
          buildozer android debug --force
        }
      timeout-minutes: 45

    - name: Find and Rename APK
      run: |
        APK_FILE=$(find bin -name "*.apk" | head -n 1)
        if [ -f "$APK_FILE" ]; then
          cp "$APK_FILE" "SafeTalk_Voice_Analyzer.apk"
          echo "APK_FILE=SafeTalk_Voice_Analyzer.apk" >> $GITHUB_ENV
          ls -la bin/
        else
          echo "No APK found!"
          find . -name "*.apk" 2>/dev/null || echo "No apk files anywhere"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SafeTalk-Voice-Analyzer
        path: SafeTalk_Voice_Analyzer.apk
        if-no-files-found: error

    - name: Upload Build Logs (if failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          .buildozer/**/*.log
          build.log
          *.log
        if-no-files-found: ignore
