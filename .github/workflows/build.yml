name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          python3-pip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev \
          libltdl-dev \
          ffmpeg \
          libfreetype6-dev \
          libpng-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install cython==0.29.37
        pip install buildozer
        pip install virtualenv
    
    - name: Create necessary directories
      run: |
        mkdir -p bin
        mkdir -p .buildozer
    
    - name: Check buildozer.spec exists
      run: |
        if [ ! -f "buildozer.spec" ]; then
          echo "Error: buildozer.spec not found!"
          exit 1
        fi
    
    - name: Create placeholder icon if not exists
      run: |
        if [ ! -f "icon.png" ]; then
          sudo apt-get install -y imagemagick
          convert -size 512x512 xc:'#4A90D9' -fill white -gravity center -pointsize 80 -annotate 0 "Voice\nAnalyzer" icon.png
        fi
    
    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug deploy
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: voice-analyzer-apk
        path: bin/*.apk
        if-no-files-found: error
