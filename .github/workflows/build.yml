# .github/workflows/build-apk.yml
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          python3-dev \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          unzip \
          openjdk-17-jdk \
          wget

    - name: Setup Java
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

    - name: Install Cython and Buildozer
      run: |
        pip install --upgrade pip
        pip install cython==0.29.37
        pip install buildozer==1.5.0

    - name: Create icon
      run: |
        mkdir -p assets
        pip install Pillow
        python3 << 'PYTHON_SCRIPT'
        from PIL import Image, ImageDraw
        img = Image.new('RGBA', (512, 512), (33, 150, 243, 255))
        draw = ImageDraw.Draw(img)
        draw.ellipse([56, 56, 456, 456], (255, 255, 255, 255))
        draw.text((256, 256), 'ST', (33, 150, 243, 255), anchor='mm', font_size=180)
        img.save('assets/safetalk_icon.png')
        PYTHON_SCRIPT

    - name: Create buildozer.spec
      run: |
        echo '[app]' > buildozer.spec
        echo 'title = SafeTalk' >> buildozer.spec
        echo 'package.name = safetalk' >> buildozer.spec
        echo 'package.domain = com.safetalk' >> buildozer.spec
        echo 'source.dir = .' >> buildozer.spec
        echo 'source.include_exts = py,png,jpg,kv,atlas,ttf' >> buildozer.spec
        echo 'version = 1.0.0' >> buildozer.spec
        echo 'requirements = python3==3.9.19,kivy==2.1.0,kivymd==1.1.1,requests==2.28.0,plyer==2.1,pyjnius==1.4.0' >> buildozer.spec
        echo 'android.permissions = INTERNET,RECORD_AUDIO,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE' >> buildozer.spec
        echo 'android.api = 30' >> buildozer.spec
        echo 'android.minapi = 21' >> buildozer.spec
        echo 'android.ndk = 23b' >> buildozer.spec
        echo 'android.sdk = 30' >> buildozer.spec
        echo 'android.archs = armeabi-v7a' >> buildozer.spec
        echo 'android.icon.filename = %(source.dir)s/assets/safetalk_icon.png' >> buildozer.spec
        echo 'fullscreen = 0' >> buildozer.spec
        echo 'orientation = portrait' >> buildozer.spec
        echo '' >> buildozer.spec
        echo '[buildozer]' >> buildozer.spec
        echo 'log_level = 2' >> buildozer.spec

    - name: Build APK
      run: |
        yes | buildozer android debug
      timeout-minutes: 60

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SafeTalk-App
        path: bin/*.apk
