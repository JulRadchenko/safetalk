name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build APK
      uses: digreatbrian/buildozer-action@v2
      with:
        command: buildozer android debug
        workdir: .
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: safetalk-apk
        path: bin/*.apk
