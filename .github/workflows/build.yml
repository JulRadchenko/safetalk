name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.py'
      - '**.kv'
      - 'requirements.txt'
      - 'buildozer.spec'
      - 'assets/*.png'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check buildozer.spec exists
      run: |
        if [ ! -f "buildozer.spec" ]; then
          echo "Error: buildozer.spec not found!"
          exit 1
        fi
        echo "buildozer.spec found"
    
    - name: Check icon exists
      run: |
        if [ ! -f "assets/safetalk_icon.png" ]; then
          echo "Error: assets/safetalk_icon.png not found!"
          exit 1
        else
          echo "Icon found: assets/safetalk_icon.png"
          ls -la assets/safetalk_icon.png
          # Копируем иконку в корень для buildozer
          cp assets/safetalk_icon.png icon.png
        fi
    
    - name: Check main.py exists
      run: |
        if [ ! -f "main.py" ]; then
          echo "Error: main.py not found!"
          exit 1
        fi
        echo "main.py found"
    
    - name: Create requirements.txt if not exists
      run: |
        if [ ! -f "requirements.txt" ]; then
          cat > requirements.txt << 'EOF'
        kivy==2.3.0
        kivymd==1.1.1
        requests==2.31.0
        plyer==2.1
        pyjnius==1.6.0
        EOF
          echo "requirements.txt created"
        else
          echo "requirements.txt found"
        fi
    
    - name: Set permissions
      run: |
        chmod -R 777 .
        mkdir -p bin .buildozer
    
    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug deploy
    
    - name: List build artifacts
      run: |
        echo "=== bin directory ==="
        ls -la bin/ || echo "bin directory not found"
        echo ""
        echo "=== All APK files ==="
        find . -name "*.apk" 2>/dev/null || echo "No APK files found"
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: safetalk-voice-analyzer-apk
        path: |
          bin/*.apk
          **/*.apk
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download APK artifacts
      uses: actions/download-artifact@v4
      with:
        name: safetalk-voice-analyzer-apk
        path: apks/
    
    - name: List downloaded files
      run: |
        ls -la apks/
        # Переименовываем APK для удобства
        for file in apks/*.apk; do
          if [ -f "$file" ]; then
            newname="apks/SafeTalk-VoiceAnalyzer-${GITHUB_REF_NAME}.apk"
            mv "$file" "$newname"
            echo "Renamed to: $newname"
          fi
        done
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: apks/*.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
