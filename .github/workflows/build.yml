name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.py'
      - '**.kv'
      - 'requirements.txt'
      - 'buildozer.spec'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          python3-pip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev \
          libltdl-dev \
          ffmpeg \
          libfreetype6-dev \
          libpng-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install cython==0.29.37
        pip install buildozer
        pip install virtualenv
    
    - name: Configure Buildozer
      run: |
        # Создаем директорию для Android SDK
        mkdir -p ~/.buildozer/android/platform/
        
        # Создаем файл для автоматического принятия лицензий
        cat > ~/.android/repositories.cfg << EOF
        ### To suppress warnings, remove this file or fill it with actual settings.
        EOF
        
        # Создаем директорию для лицензий
        mkdir -p ~/.android/licenses/
        
        # Принимаем все лицензии Android SDK
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.android/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.android/licenses/android-sdk-preview-license
        echo "d975f751698a77b662f1254ddbeed3901e976f25" > ~/.android/licenses/intel-android-extra-license
        echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > ~/.android/licenses/google-gdk-license
        echo "e9acab5b5fbb560a72cfaecce8946896ff6a5049" > ~/.android/licenses/mips-android-sysimage-license
    
    - name: Create necessary directories
      run: |
        mkdir -p bin
        mkdir -p .buildozer
    
    - name: Check buildozer.spec exists
      run: |
        if [ ! -f "buildozer.spec" ]; then
          echo "Error: buildozer.spec not found!"
          exit 1
        fi
        echo "buildozer.spec found"
    
    - name: Check icon exists
      run: |
        if [ ! -f "assets/safetalk_icon.png" ]; then
          echo "Warning: icon.png not found! Build may fail."
        else
          echo "assets/safetalk_icon.png found"
          ls -la assets/safetalk_icon.png
        fi
    
    - name: Clean previous build (optional)
      run: |
        # Очищаем предыдущую сборку, если есть проблемы
        rm -rf .buildozer/android/platform/build-*
        rm -rf bin/*.apk
    
    - name: Build APK with Buildozer
      run: |
        # Устанавливаем переменные окружения для автоматического принятия лицензий
        export ANDROID_SDK_ROOT=/home/runner/.buildozer/android/platform/android-sdk
        export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
        
        # Запускаем сборку с автоматическим принятием лицензий
        yes | buildozer -v android debug deploy || buildozer -v android debug deploy
    
    - name: List build artifacts
      run: |
        echo "=== bin directory ==="
        ls -la bin/ || echo "bin directory not found"
        echo ""
        echo "=== Searching for APK files ==="
        find . -name "*.apk" 2>/dev/null || echo "No APK files found"
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: voice-analyzer-apk
        path: |
          bin/*.apk
          **/*.apk
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download APK artifacts
      uses: actions/download-artifact@v4
      with:
        name: voice-analyzer-apk
        path: apks/
    
    - name: List downloaded files
      run: ls -la apks/
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: apks/*.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
