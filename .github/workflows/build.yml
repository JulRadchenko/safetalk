name: Build APK with Docker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build APK with Docker
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/app \
          -w /app \
          kivy/buildozer:latest \
          android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: safetalk-apk
        path: bin/*.apk
