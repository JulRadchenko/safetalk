# .github/workflows/build-apk.yml
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:2.0.0
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create icon
      run: |
        mkdir -p assets
        pip install Pillow
        python3 -c "
        from PIL import Image, ImageDraw
        img = Image.new('RGBA', (512, 512), (33, 150, 243, 255))
        draw = ImageDraw.Draw(img)
        draw.ellipse([56, 56, 456, 456], (255, 255, 255, 255))
        draw.text((256, 256), 'ST', (33, 150, 243, 255), anchor='mm', font_size=180)
        img.save('assets/safetalk_icon.png')
        "

    - name: Create buildozer.spec
      run: |
        echo '[app]' > buildozer.spec
        echo 'title = SafeTalk' >> buildozer.spec
        echo 'package.name = safetalk' >> buildozer.spec
        echo 'package.domain = com.safetalk' >> buildozer.spec
        echo 'source.dir = .' >> buildozer.spec
        echo 'source.include_exts = py,png,jpg,kv,atlas,ttf' >> buildozer.spec
        echo 'version = 1.0.0' >> buildozer.spec
        echo 'requirements = python3,kivy==2.1.0,kivymd==1.1.1,requests==2.28.0,plyer==2.1,pyjnius==1.4.0' >> buildozer.spec
        echo 'android.permissions = INTERNET,RECORD_AUDIO,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE' >> buildozer.spec
        echo 'android.api = 30' >> buildozer.spec
        echo 'android.minapi = 21' >> buildozer.spec
        echo 'android.ndk = 23c' >> buildozer.spec
        echo 'android.sdk = 30' >> buildozer.spec
        echo 'android.archs = armeabi-v7a' >> buildozer.spec
        echo 'android.icon.filename = %(source.dir)s/assets/safetalk_icon.png' >> buildozer.spec
        echo 'fullscreen = 0' >> buildozer.spec
        echo 'orientation = portrait' >> buildozer.spec
        echo '' >> buildozer.spec
        echo '[buildozer]' >> buildozer.spec
        echo 'log_level = 2' >> buildozer.spec

    - name: Build APK
      run: |
        yes | buildozer android debug
      timeout-minutes: 60

    - name: Find and upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SafeTalk-App
        path: bin/*.apk
