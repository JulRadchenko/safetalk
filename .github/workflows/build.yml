name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libncurses5 \
            libncurses5-dev \
            autoconf \
            automake \
            libtool \
            cmake \
            zip \
            unzip \
            openjdk-17-jdk-headless

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Build APK
        run: |
          # Фикс для ошибки Cython с long
          pip install "cython<3.0"
          pip install pyjnius==1.6.1
          
          # Устанавливаем Java 17 (Gradle 9 требует Java 17+)
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          
          # Проверяем версии
          echo "Java version:"
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          # Даём права на выполнение gradlew (если он уже скачан)
          chmod +x /home/runner/work/safetalk/safetalk/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/dists/safetalk/gradlew 2>/dev/null || true
          
          # Запускаем сборку с подробным логом
          buildozer android debug 2>&1 | tee build.log
          
          # Если упало - показываем содержимое лога Gradle если он есть
          if [ $? -ne 0 ]; then
            echo "=== GRADLE ERROR LOG ==="
            find /home/runner/work/safetalk/safetalk/.buildozer -name "*.log" -exec tail -n 100 {} \; 2>/dev/null || echo "No gradle logs found"
            exit 1
          fi
        timeout-minutes: 30

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeTalk-APK
          path: bin/*.apk
