name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.py'
      - '**.kv'
      - 'requirements.txt'
      - 'buildozer.spec'
      - 'assets/*.png'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          python3-pip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev \
          libltdl-dev \
          ffmpeg \
          libfreetype6-dev \
          libpng-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libxcb-shm0-dev \
          libxcb-xfixes0-dev
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install cython==0.29.37
        pip install buildozer
        pip install virtualenv
    
    - name: Configure Android licenses
      run: |
        # Создаем директории для лицензий
        mkdir -p ~/.android
        mkdir -p ~/.android/licenses/
        
        # Создаем файл repositories.cfg
        touch ~/.android/repositories.cfg
        
        # Принимаем все лицензии Android SDK
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.android/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.android/licenses/android-sdk-preview-license
        echo "d975f751698a77b662f1254ddbeed3901e976f25" > ~/.android/licenses/intel-android-extra-license
        echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > ~/.android/licenses/google-gdk-license
        echo "e9acab5b5fbb560a72cfaecce8946896ff6a5049" > ~/.android/licenses/mips-android-sysimage-license
        
        echo "Licenses configured"
    
    - name: Create necessary directories
      run: |
        mkdir -p bin
        mkdir -p .buildozer
    
    - name: Check buildozer.spec exists
      run: |
        if [ ! -f "buildozer.spec" ]; then
          echo "Error: buildozer.spec not found!"
          exit 1
        fi
        echo "buildozer.spec found"
    
    - name: Prepare icon
      run: |
        if [ ! -f "assets/safetalk_icon.png" ]; then
          echo "Warning: assets/safetalk_icon.png not found!"
        else
          echo "Icon found, copying to root"
          cp assets/safetalk_icon.png icon.png
        fi
    
    - name: Build APK with Buildozer (non-interactive)
      run: |
        # Автоматически отвечаем yes на все вопросы
        yes | buildozer android debug deploy 2>&1 || true
        
        # Если не получилось, пробуем с флагом force
        buildozer android debug deploy --force || true
        
        # Еще одна попытка с обновлением
        buildozer init
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        yes | buildozer android debug deploy
    
    - name: List build artifacts
      run: |
        echo "=== bin directory ==="
        ls -la bin/ 2>/dev/null || echo "bin directory not found"
        echo ""
        echo "=== All APK files ==="
        find . -name "*.apk" 2>/dev/null || echo "No APK files found"
        echo ""
        echo "=== .buildozer directory ==="
        ls -la .buildozer/ 2>/dev/null || echo ".buildozer not found"
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: safetalk-voice-analyzer-apk
        path: |
          bin/*.apk
          **/*.apk
        if-no-files-found: warn
