name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Free space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          sudo apt-get clean
          echo "Free space after cleanup:"
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pip build-essential git python3-dev \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libncurses5 libncurses5-dev autoconf automake libtool cmake zip unzip \
            openjdk-17-jdk-headless wget
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install Buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "cython<3.0"
          pip install buildozer==1.5.0

      - name: Configure git for Buildozer
        run: |
          git config --global user.email "builder@github.com"
          git config --global user.name "GitHub Actions Builder"

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Безопасный разговор
          package.name = safetalk
          package.domain = com.safetalk
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,ttf,wav
          source.include_patterns = assets/*.png,assets/*.jpg
          source.exclude_exts = spec,log,pyc
          source.exclude_dirs = tests,bin,.git,__pycache__,venv,.github
          version = 1.0.0
          
          requirements = python3,hostpython3,kivy==2.3.0,kivymd==2.0.1.dev0,requests==2.31.0,pyjnius==1.6.1,plyer==2.1
          
          icon.filename = %(source.dir)s/assets/safetalk_icon.png
          
          android.permissions = RECORD_AUDIO, INTERNET, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE
          android.api = 33
          android.minapi = 21
          android.ndk = 25.2.9519653
          android.sdk = 33.0.2
          android.build_tools_version = 33.0.2
          android.enable_androidx = True
          android.gradle = True
          android.gradle_version = 7.4.2
          android.java_jdk = 17
          android.archs = arm64-v8a
          android.enable_java8 = True
          android.debug = 1
          
          p4a.branch = develop
          
          [buildozer]
          log_level = 2
          android.accept_sdk_license = True
          EOF

      - name: Create p4a config
        run: |
          mkdir -p .p4a
          cat > .p4a/config.ini << 'EOF'
          [sdk_config]
          default_android_api = 33
          default_ndk_api = 21
          EOF

      - name: Clean Python cache and old builds
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete
          rm -rf ~/.buildozer/android/platform/* 2>/dev/null || true

      - name: Build APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          export USE_SDK_WRAPPER=1
          
          # Удаляем старый NDK если есть
          rm -rf ~/.buildozer/android/platform/android-ndk-*
          
          # Запускаем сборку
          yes | buildozer -v android debug 2>&1 | tee build.log
        timeout-minutes: 60

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafeTalk-APK
          path: bin/*.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
