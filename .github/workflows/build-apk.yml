name: Build APK Simple

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9.10'
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk unzip zip
        pip install buildozer cython
    
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = SafeTalk
        package.name = safetalk
        package.domain = com.safetalk
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,otf,wav,mp3,m4a
        requirements = kivy==2.2.1,kivymd==1.1.1,requests==2.31.0,plyer==2.1,pyjnius==1.5.0,android==1.0.0
        orientation = portrait
        android.permissions = RECORD_AUDIO,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,INTERNET
        android.api = 30
        android.minapi = 21
        android.ndk = 23b
        android.sdk = 30
        android.arch = arm64-v8a
        android.accept_sdk_license = True
        android.accept_ndk_license = True
        android.enable_androidx = True
        
        [buildozer]
        log_level = 2
        EOF
        
        # Добавляем иконку если существует
        if [ -f "assets/safetalk_icon.png" ]; then
          echo "icon.filename = assets/safetalk_icon.png" >> buildozer.spec
        fi
    
    - name: Build
      run: |
        yes | buildozer android debug 2>&1 | tee build.log
      timeout-minutes: 60
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: safetalk-app
        path: bin/*.apk
