name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip build-essential git python3-dev \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libncurses5 libncurses5-dev autoconf automake libtool cmake zip unzip \
            openjdk-17-jdk-headless

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install "cython<3.0"
          pip install buildozer

      - name: Create buildozer.spec
        run: |
          # Создаем правильный buildozer.spec с самого начала
          cat > buildozer.spec << 'EOF'
          [app]
          title = Безопасный разговор
          package.name = safetalk
          package.domain = com.safetalk
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,ttf,wav
          source.include_patterns = assets/*.png,assets/*.jpg
          source.exclude_exts = spec,log,pyc
          source.exclude_dirs = tests,bin,.git,__pycache__,venv
          version = 1.0.0
          requirements = python3==3.10.14,hostpython3==3.10.14,kivy==2.3.0,kivymd==2.0.1.dev0,requests==2.31.0,pyjnius==1.6.1,plyer==2.1
          icon.filename = %(source.dir)s/assets/safetalk_icon.png
          android.permissions = RECORD_AUDIO, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE, INTERNET
          android.api = 33
          android.minapi = 21
          android.sdk = 33
          android.ndk = 23b
          android.build_tools_version = 33.0.2
          android.enable_androidx = True
          android.gradle = True
          android.gradle_version = 7.4.2
          android.java_jdk = 17
          android.arch = arm64-v8a
          android.enable_java8 = True
          android.debug = 1
          
          [buildozer]
          log_level = 2
          android.accept_sdk_license = True
          EOF

      - name: Build APK with auto-accept licenses
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          
          # Buildozer сам установит SDK и примет лицензии
          # Используем expect для автоматического принятия лицензий
          sudo apt-get install -y expect
          
          # Создаем скрипт для автоматического принятия
          cat > accept_licenses.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout 10
          spawn buildozer -v android debug
          expect {
              "Accept? (y/N):" {
                  send "y\r"
                  exp_continue
              }
              "Do you accept the license?" {
                  send "y\r"
                  exp_continue
              }
              eof
          }
          EOF
          
          chmod +x accept_licenses.exp
          ./accept_licenses.exp 2>&1 | tee build.log

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafeTalk-APK
          path: bin/*.apk
