name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip build-essential git python3-dev \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libncurses5 libncurses5-dev autoconf automake libtool cmake zip unzip \
            openjdk-17-jdk-headless

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install "cython<3.0"
          pip install buildozer

      - name: Create buildozer.spec (fixed)
        run: |
          # Если файла нет, создаём с правильными настройками
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          
          # Исправляем конфигурацию
          sed -i 's/^android.arch =.*/android.archs = arm64-v8a, armeabi-v7a/g' buildozer.spec
          sed -i 's/^android.sdk =.*/# android.sdk = 33/g' buildozer.spec
          sed -i 's/^android.ndk =.*/android.ndk = 23b/g' buildozer.spec
          sed -i 's/^android.minapi =.*/android.minapi = 21/g' buildozer.spec
          sed -i 's/^android.targetapi =.*/android.targetapi = 33/g' buildozer.spec
          sed -i 's/^android.accept_sdk_license =.*/android.accept_sdk_license = True/g' buildozer.spec

      - name: Build APK with auto-accept licenses
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          
          # Принудительно принимаем все лицензии SDK
          yes | sdkmanager --licenses || true
          
          # Сборка с явными параметрами
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafeTalk-APK
          path: bin/*.apk
