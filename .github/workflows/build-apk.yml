name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-20.04  # Используем Ubuntu 20.04 для стабильности
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9.10'  # Фиксированная версия Python
        architecture: 'x64'
    
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          openjdk-17-jdk \
          unzip \
          zip \
          git \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          cmake \
          libffi-dev \
          libssl-dev
    
    - name: Install buildozer and cython
      run: |
        python -m pip install --upgrade pip
        pip install cython==0.29.33
        pip install buildozer==1.5.0
    
    - name: Configure buildozer
      run: |
        # Удаляем старый spec если есть
        rm -f buildozer.spec
        
        # Создаем новый spec файл с правильными настройками
        buildozer init
        
        # Ключевое исправление - НЕ указываем версию python3 в requirements
        sed -i 's/^requirements = .*/requirements = kivy==2.2.1,kivymd==1.1.1,requests==2.31.0,plyer==2.1,pyjnius==1.5.0,android==1.0.0/' buildozer.spec
        
        # Основные настройки
        sed -i 's/^# android.permissions = .*/android.permissions = RECORD_AUDIO,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,INTERNET/' buildozer.spec
        sed -i 's/^# android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/^# android.accept_ndk_license = .*/android.accept_ndk_license = True/' buildozer.spec
        
        # Настройка иконки (проверяем существование)
        if [ -f "assets/safetalk_icon.png" ]; then
          sed -i 's/^# icon.filename = .*/icon.filename = assets\/safetalk_icon.png/' buildozer.spec
        fi
        
        # API настройки
        sed -i 's/^# android.api = .*/android.api = 30/' buildozer.spec
        sed -i 's/^# android.minapi = .*/android.minapi = 21/' buildozer.spec
        sed -i 's/^# android.ndk = .*/android.ndk = 23b/' buildozer.spec  # Используем стабильный NDK
        sed -i 's/^# android.sdk = .*/android.sdk = 30/' buildozer.spec
        
        # Архитектура
        sed -i 's/^# android.arch = .*/android.arch = arm64-v8a/' buildozer.spec
        
        # Дополнительные настройки
        echo "android.enable_androidx = True" >> buildozer.spec
        echo "android.gradle_dependencies = 'androidx.core:core:1.9.0'" >> buildozer.spec
        
        # Отключаем ненужные архитектуры
        sed -i 's/^# armeabi-v7a = True/armeabi-v7a = False/' buildozer.spec
        sed -i 's/^# arm64-v8a = True/arm64-v8a = True/' buildozer.spec
        
        # Название приложения
        sed -i 's/^title = .*/title = SafeTalk/' buildozer.spec
        sed -i 's/^package.name = .*/package.name = safetalk/' buildozer.spec
        sed -i 's/^package.domain = .*/package.domain = com.safetalk/' buildozer.spec
        
        echo "Buildozer spec configured successfully"
        echo "=== Current settings ==="
        grep -E "^(requirements|android.permissions|icon.filename|android.api|android.arch|title)" buildozer.spec || true
    
    - name: Build APK
      run: |
        # Сборка с таймаутом
        yes | buildozer -v android debug 2>&1 | tee build.log
      timeout-minutes: 90
      env:
        # Принудительно используем Python 3.9
        PATH: /opt/hostedtoolcache/Python/3.9.10/x64/bin:${{ env.PATH }}
    
    - name: Find APK
      run: |
        echo "Searching for APK files..."
        find . -name "*.apk" 2>/dev/null
        echo "=== bin directory ==="
        ls -la bin/ 2>/dev/null || echo "bin directory not found"
        echo "=== build directory ==="
        find .buildozer -name "*.apk" 2>/dev/null | head -10 || true
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: SafeTalk-App
        path: |
          bin/*.apk
          .buildozer/android/platform/build-*/**/*.apk
        if-no-files-found: warn
    
    - name: Show error log
      if: failure()
      run: |
        echo "=== Last 100 lines of build log ==="
        tail -100 build.log 2>/dev/null || echo "No build log"
        echo "=== Python version ==="
        python --version
        echo "=== Buildozer spec ==="
        cat buildozer.spec 2>/dev/null | head -50 || true
