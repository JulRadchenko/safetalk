name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04  # Используем старую версию Ubuntu
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install buildozer
      run: |
        pip install buildozer cython
        sudo apt update
        sudo apt install -y openjdk-17-jdk unzip zip
    
    - name: Create buildozer.spec
      run: |
        buildozer init
        cat >> buildozer.spec << 'EOF'
        # Custom settings for SafeTalk
        requirements = python3==3.9.10,kivy==2.2.1,kivymd==1.1.1,requests==2.31.0,plyer==2.1,pyjnius==1.5.0,android==1.0.0
        android.permissions = RECORD_AUDIO,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,INTERNET
        android.accept_sdk_license = True
        android.accept_ndk_license = True
        icon.filename = assets/safetalk_icon.png
        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        android.sdk = 33
        android.arch = arm64-v8a
        android.enable_androidx = True
        EOF
    
    - name: Build APK
      run: yes | buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: safetalk-app
        path: bin/*.apk
