name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libncurses5 \
            libncurses5-dev \
            autoconf \
            automake \
            libtool \
            cmake \
            zip \
            unzip \
            openjdk-17-jdk-headless

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv
          pip install "cython<3.0"
          pip install pyjnius==1.6.1

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = SafeTalk Voice Analyzer
          package.name = safetalk
          package.domain = com.safetalk
          version = 1.0.0
          version.code = 1
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,ttf,otf,wav,mp3,m4a
          requirements = kivy==2.2.1,kivymd==1.1.1,requests==2.31.0,plyer==2.1,pyjnius==1.6.1,android==1.0.0
          orientation = portrait
          fullscreen = 0
          android.permissions = RECORD_AUDIO,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,INTERNET
          android.api = 30
          android.minapi = 21
          android.ndk = 25b
          android.sdk = 30
          android.arch = arm64-v8a
          android.accept_sdk_license = True
          android.accept_ndk_license = True
          android.enable_androidx = True
          android.gradle_dependencies = 'androidx.core:core:1.9.0'
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          
          if [ -f "assets/safetalk_icon.png" ]; then
            echo "icon.filename = assets/safetalk_icon.png" >> buildozer.spec
          fi
          
          echo "=== buildozer.spec created ==="
          cat buildozer.spec

      - name: Build APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          
          echo "Java version:"
          java -version
          echo "Starting build..."
          
          yes | buildozer -v android debug 2>&1 | tee build.log
          
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            tail -100 build.log
            exit 1
          fi
        timeout-minutes: 60

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeTalk-APK
          path: bin/*.apk
          if-no-files-found: error
